[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Gerhold", email = "michael.gerhold@web.de" }
]
requires-python = ">=3.13"

# `faker` is deliberately not listed as dev dependency because we need it
# for deploying in the staging environment. However, both staging and production
# shall use the same image. Therefore, we include it in both.
dependencies = [
    "alembic>=1.20.1",
    "faker>=40.63.0",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "authlib>=1.8.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
    "tzdata>=2026.6",
    "sqlalchemy[asyncio]>=2.1.9",
    "werkzeug>=3.1.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.48.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
    "types-authlib>=1.8.0.20261106",
]

[tool.setuptools.package-data]
"backend" = ["py.typed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
check = { cmd = "scripts/check.py" }
fix = { cmd = "scripts/check.py --fix" }
test = { cmd = "scripts/check.py --test" }
run = { cmd = "uvicorn backend.main:app --host 0.0.0.0 --port 8080 --reload" }

[tool.pytest.ini_options]
markers = [
    "integration: tests that require the locally running backend stack",
]
