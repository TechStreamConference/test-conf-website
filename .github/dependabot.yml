version: 2

updates:
  - package-ecosystem: docker-compose
    directory: /ops
    schedule:
      interval: quarterly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: quarterly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: quarterly
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: quarterly
