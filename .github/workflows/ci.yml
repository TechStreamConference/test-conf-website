name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  container-build:
    name: ${{ matrix.project-part }}-container-build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project-part:
          - frontend
          - backend

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.project-part }} container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project-part }}
          push: false
          load: true
          tags: test-conf-${{ matrix.project-part }}:ci

      - name: Smoke-test frontend container
        if: matrix.project-part == 'frontend'
        run: |
          docker run --detach \
            --name frontend-smoke \
            --publish 127.0.0.1:3000:3000 \
            test-conf-frontend:ci

          curl --fail --silent --show-error \
            --retry 15 \
            --retry-delay 1 \
            --retry-all-errors \
            http://127.0.0.1:3000/robots.txt > /dev/null

      - name: Show frontend container logs
        if: always() && matrix.project-part == 'frontend'
        run: docker logs frontend-smoke || true

      - name: Stop frontend container
        if: always() && matrix.project-part == 'frontend'
        run: docker rm --force frontend-smoke || true

  ci:
    name: ${{ matrix.project-part }}-${{ matrix.command }}
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: dev
      BACKEND_ROOT_URI: http://localhost/api
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_ECHO: "false"

    strategy:
      fail-fast: false
      matrix:
        command:
          - check
          - test
        project-part:
          - frontend
          - backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install ${{ matrix.project-part }} project dependencies
        run: nix develop --command just init-ci

      - name: Install Playwright browsers
        if: matrix.project-part == 'frontend' && matrix.command == 'test'
        run: nix develop --command just e2e-init

      - name: Start backend integration-test stack
        if: matrix.project-part == 'backend' && matrix.command == 'test'
        run: |
          cp .env.example .env
          nix develop --command just up
          nix develop --command just backend-migrate
          nix develop --command just backend-seed-dev
          nohup nix develop --command \
            uv run --directory backend uvicorn backend.main:app --host 0.0.0.0 --port 8080 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &

          for _ in {1..30}; do
            if curl --fail --silent http://localhost/api/openapi.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Run ${{ matrix.project-part }} ${{ matrix.command }}
        run: nix develop --command just ${{ matrix.project-part }}-${{ matrix.command }}

      - name: Stop backend integration-test stack
        if: always() && matrix.project-part == 'backend' && matrix.command == 'test'
        run: docker compose down --volumes


  storybook:
    name: frontend-storybook-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install frontend project dependencies
        run: nix develop --command pnpm --dir frontend install --frozen-lockfile

      - name: Build Storybook
        run: nix develop --command just frontend-storybook-build
