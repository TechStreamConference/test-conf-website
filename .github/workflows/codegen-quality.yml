name: codegen-quality

on:
  pull_request:
  workflow_dispatch:

jobs:
  codegen-quality:
    name: codegen-${{ matrix.command }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        command:
          - check
          - test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Initialize CI environment
        run: nix develop --command just init-ci

      - name: Run codegen ${{ matrix.command }}
        run: nix develop --command just codegen-${{ matrix.command }}
