name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure development environment
        run: cp .env.example .env

      - name: Install project dependencies
        run: nix develop --command just init-ci

      - name: Start stack
        run: |
          nix develop --command just up
          nix develop --command just backend-migrate
          nix develop --command just backend-seed-dev

          nix develop --command just run > "$RUNNER_TEMP/application.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/application.pid"

          curl --fail --silent --show-error \
            --retry 60 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1/ > /dev/null

      - name: Run end-to-end tests
        run: |
          docker run --rm --init --ipc=host --network=host \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work/frontend \
            --env CI=true \
            mcr.microsoft.com/playwright:v1.62.0-noble \
            node node_modules/playwright/cli.js test

      - name: Upload test report and application log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            ${{ runner.temp }}/application.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop stack
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/application.pid"; then
            kill "$(cat "$RUNNER_TEMP/application.pid")" 2>/dev/null || true
          fi
          nix develop --command just down || true
