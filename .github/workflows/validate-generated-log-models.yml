name: validate-log-models

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-log-models:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Initialize CI environment
        run: nix develop --command just init-ci

      - name: Generate Pydantic + Zod event models
        run: nix develop --command just gen-log-models

      - name: Check generated models are up to date
        run: |
          git diff --exit-code \
            backend/src/backend/logging/events_gen.py \
            frontend/src/logging/events.gen.ts
