name: validate-log-models

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-log-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Initialize CI environment
        run: nix develop --command just init-ci

      - name: Generate Pydantic + Zod event models
        run: nix develop --command just gen-log-models

      - name: Check generated models are up to date
        run: |
          git diff --exit-code \
            backend/src/backend/logging/events_gen.py \
            frontend/src/logging/events.gen.ts
