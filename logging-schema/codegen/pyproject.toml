[project]
name = "log-event-codegen"
version = "0.1.0"
description = "Project-specific code generator: JSON Schema → Pydantic v2 models and Zod schemas"
requires-python = ">=3.13"

dependencies = [
    "jinja2>=3.1.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegen"]

[tool.pytest.ini_options]
testpaths = ["src/test"]

[tool.ruff]
extend = "../../backend/ruff.toml"

[tool.ruff.lint.per-file-ignores]
"src/test/**/test_*.py" = ["S101", "S108", "S105", "S106"]
