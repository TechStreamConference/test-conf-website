services:
  alloy:
    image: grafana/alloy:v1.8.0
    container_name: alloy-${ENVIRONMENT}
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/staging.alloy:/etc/alloy/config.alloy:ro
    environment:
      # Internal address of the central observability server — must NOT be a
      # public URL since Loki ingestion endpoints are not exposed publicly.
      LOKI_URL: ${LOKI_URL:-http://127.0.0.1:3100}
    network_mode: host
    restart: unless-stopped
