server {
    listen 80;

    proxy_busy_buffers_size 512k;
    proxy_buffers 4 512k;
    proxy_buffer_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Serve frontend
    location / {
        proxy_pass http://localhost:5173;

        # --- WebSocket support for Vite hot reloading ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy API requests to backend
    location /api/ {
        # A single address: nginx never marks the only server of a group as unavailable. `localhost` would also
        # resolve to `::1`, where the backend doesn't listen, and a refused connection would then make nginx reject
        # all API requests for 10 seconds.
        proxy_pass http://127.0.0.1:8080/;
    }
}
