services:
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy-${ENVIRONMENT}
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/production.alloy:/etc/alloy/config.alloy:ro
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      ALLOY_DOCKER_COMPOSE_PROJECT: ${ALLOY_DOCKER_COMPOSE_PROJECT:?Set ALLOY_DOCKER_COMPOSE_PROJECT in .env}
    networks:
      - observability
    restart: unless-stopped

networks:
  observability:
    external: true
    name: observability-central
