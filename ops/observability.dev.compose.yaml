services:
  loki:
    image: grafana/loki:3.7.7
    container_name: loki-${ENVIRONMENT}
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki_data:/loki
      - ./loki/dev-config.yaml:/etc/loki/config.yaml:ro
    networks:
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 2s
      timeout: 1s
      retries: 30

  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana-${ENVIRONMENT}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # In development Grafana is unauthenticated for ease of use.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_LOG_LEVEL: "warn"
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.8.0
    container_name: alloy-${ENVIRONMENT}
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ../.logs:/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/dev.alloy:/etc/alloy/config.alloy:ro
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loki_data:
  grafana_data:

networks:
  observability:
    name: observability-${ENVIRONMENT}
